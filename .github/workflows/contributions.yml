name: Refresh contributions

on:
  schedule:
    # four attempts a day (GitHub cron is best-effort and can be delayed/dropped)
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contributions.yml"
      - "scripts/update_contributions.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README contribution table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: Goldloli
        run: python3 scripts/update_contributions.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh open-source contributions"
          git push
